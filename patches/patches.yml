# 对 upstream/ 的全部源码变更都在此登记，sync-upstream.ts 按顺序 git apply。
#
# 边界铁律：能做成 dsh 插件的不动配置，能写成 cordis.patch.yml 配置叠层的不动源码。
# 只有当前两条路都走不通时才允许新增补丁，且必须写明理由。
#
# ⚠️ 0.1.2 迁移期临时状态（upgrade/dsh-v0.1.2-rc.1 分支）：
#   除 0004 外的全部补丁已暂摘，等待按 docs/upgrade-dsh-0.1.2-rc.1-phases.md
#   的阶段计划在新版宿主上重做后逐个回归登记。原登记见 git 历史。
#
# 每条记录：
#   file:     补丁文件名（相对本目录，建议 NNNN-描述.patch 命名）
#   reason:   为什么必须改源码（而不是插件/配置）
#   upstream: 对应的上游 issue/PR（有则填，上游修复后应移除本补丁）
patches:
  - file: 0004-sidebar-default-width.patch
    reason: 桌面侧栏默认宽度取 320；columns.ts 是契约常量且 layout 服务面刻意不暴露宽度写入（ILayout 仅 toggle/open/close），插件与配置层均不可达。两版上游 columns.ts 逐字未变（仍 SIDEBAR_DEFAULT=280），是 0.1.2 实测唯一可原样套用的补丁；0006 重做回归后按新四列版重排，届时随 0006 一并更新本条
