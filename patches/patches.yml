# 对 upstream/ 的全部源码变更在此登记，sync-upstream.ts 按队列顺序应用。
# 优先 dsh 插件，再配置叠层，最后才是公开 API 不可达处的最小源码接缝。
# 所有补丁均针对 dsh-v0.1.2-rc.1；后续修正与测试并回对应补丁，不叠加补丁修补补丁。
patches:
  - file: 0006-ui-layout-panel-seam.patch
    reason: |
      ui-layout 内部列分配、宽度常量、缩放与全屏布局不支持插件增列，也无配置写入面。
      保留 panel 列、声明/渲染点、布局 store 和动作；实际页签与面板内容由 panel-shell
      客户端插件提供。保留 main 的侧栏 320、主栏最小 360、面板默认 480/最小 320
      及无固定偏好宽度上限，覆盖拖动、放大、静态槽与折叠轨回归。
      原 0019 布局测试并入；上游提供等价可扩展列布局后撤。
  - file: 0008-ui-chat-panel-inspect-handoff.patch
    reason: |
      Inspect 的 openView 合成封闭于 ChatView；conversation 外的面板无法收到内部
      store 目标。保留可选 inspectHandoff 注入，panelShell 存在时委托一次性交接，
      缺席时走原生 trajectory tab；面板页适配、metadata 与入口接管在 panel-shell。
      上游提供跨容器 Inspect 路由贡献面后撤。
  - file: 0009-ui-chat-file-browser-open-seam.patch
    reason: |
      openFile 封闭于 ui-chat 的注入闭包，原生只调用系统 openWorkspacePath。
      保留可选 tryOpen 拦截点，传 sessionId/cwd/解析后的 path；点目录、服务缺席或
      未处理路径仍走原生系统打开。树、预览和路径判定均在 file-browser 插件。
      原 0019 请求契约和回归并入；上游提供 openFile middleware 后撤。
  - file: 0005-conversation-chat-group-seam.patch
    reason: |
      上游无 chat flow 重组座位，插件无法替换私有节点装配或复用原生 Seat 的回合
      折叠与搜索隐藏逻辑。保留 conversation.chat.group、可选 flowGrouping、
      块范围渲染变体及原生 Seat 可见性；分组规则、摘要、交互和全部双语词条归
      activity-group 插件。原 0017 与 0019 分组修正/回归并入，不在上游保存分组词典。
      上游提供等价 flow 与节点变体 API 后撤。
  - file: 0010-api-session-controller-image-admission.patch
    reason: |
      附件持久化前的图片准入位于 Session Remote 私有实现，插件无法表达可转写。
      commands.ts 内抽取 imagePromptAdmission 并询问可选 imageInputAdmission；
      模型原生 inputModalities 不伪装，native/unknown 与无图路径保留原行为，明确
      text-only 才由桥接服务决定。桥接失败沿用原生 RemoteError；原 0019 语义/测试并入。
      上游提供等价持久化前图片准入钩子后撤。
  - file: 0011-llm-input-transform-seam.patch
    reason: |
      精确模型能力解析后、适配器 dispatch 前没有公开输入变换钩子。保留通用
      registerInputTransform 与序列/卸载契约；图片转写、缓存和媒体策略均在
      @dsh-desktop/vision 插件，不改变模型原生能力。上游提供等价 pre-dispatch API 后撤。
  - file: 0012-core-session-rewind-tombstone.patch
    reason: |
      append 已有公开 API，墓碑写入由 rewind 插件负责；但 live append、fromRestore
      与 foldSurface 共用的 planSurfaceEvent/applySurfacePlan 汇合点是私有的，
      插件无法改变模型上下文折叠。保留截断解释及 required 已知事件登记，覆盖重放。
      TokenMeter 私有游标状态与构造器注册的价格投影同样无法局部替换；同步截断
      测量/压缩表面并移除失效校准。投影 apply 的可选惰性只读历史参数仅暴露当前
      已提交前缀，普通事件仍 O(1)；v5/v3 缓存版本使旧价格重算，累计计费不回滚。
      墓碑不能标 ignorable，否则原版 CLI 会重建错误上下文；其拒读行为见 ADR-0007。
      上游提供通用 surface reducer 或原生 rewind/truncate 后撤。
  - file: 0013-session-controller-rewind-fold.patch
    reason: |
      Session 事件源由私有构造/订阅路径持有，现有插件不能为已打开与未来 Session
      一致安装、卸载读取投影。补丁只提供通用 sessionEventViews 注册表、稳定代理
      与 historyStartSeq 只读原始分页游标；内部 raw 源仍负责分页/去重，公开
      session.eventSource 与 binding.eventSource 始终共享同一视图。
      墓碑识别、范围过滤与零拷贝 delta 均移到 rewind 客户端；turnOutline 则由
      rewind 使用原生 sessionProjections + 配置禁用原 owner 替换，无上游投影补丁。
      覆盖既有/新建绑定、卸载恢复、注册失败清理及隐藏整页仍推进原始游标。
      上游提供等价 Session event view middleware 后撤。
  - file: 0014-settings-nav-archive-icon.patch
    reason: |
      settings.section options 不接受图标，shell 的 navIcon 只按内建 id 分派。
      仅新增通用 keyed settings.section.icon 贡献槽与原生图标 fallback；
      archive-manager 的 id、图标选择和注册均在其客户端插件，不在上游硬编码。
      上游提供 section 图标贡献面后撤。
  - file: 0015-win32-dialog-sandbox-safe-utf16-read.patch
    reason: |
      Electron 的 V8 Sandbox 禁止 koffi.view 将 COM 内存包装成 external ArrayBuffer。
      保留 readUtf16 单处兼容修复，以 koffi.decode.string16 复制解码并保留原生
      COM dialog、DPI、取消和 worker 生命周期。已验证可公开替换整个 provider，但
      原生 API 仅允许替换完整 pickWin32Dialog，无解码/COM bindings/worker 细粒度
      钩子；零补丁需自持约 576 行五个原生实现文件，维护面大于本兼容修复。
      测试不再提供 view mock，防止回退；上游改用安全解码后撤。
  - file: 0001-session-row-archive-context-menu.patch
    reason: |
      原生会话行 rename/fork/archive 已直接复用；其菜单数组和行尾无公开贡献面。
      仅增加通用 sessionRowActions 注册表、menu/inline 渲染与右键锚点；导出链接、
      hover 快速归档、图标和双语词条归 session-actions 插件，空会话仍隐藏操作。
      原 0018 合并，原生菜单与贡献回调并测；上游提供行级 action API 后撤。
  - file: 0007-ui-trajectory-panel-page.patch
    reason: |
      原生 TrajectoryView 的注入闭包/图片子槽和默认 tab 占位无法由外部插件复用。
      仅公开通用 trajectoryView.create 与 setDefaultEnabled，缺省仍保留原生 tab。
      PanelTrajectoryView、inspect props 适配、required 会话元数据、图标和接管逻辑
      均在 panel-shell；原 0016 receiver 修正合回，验证重复 enable 幂等及卸载恢复。
      上游提供可复用轨迹贡献 factory 与默认入口开关后撤。
  - file: 0016-workspace-unarchive-api.patch
    reason: |
      WorkspaceRegistry 没有公开取消归档 API；直接写 storageDomain 无法更新内存，
      插件访问私有 state/setState/enqueueOperation 则绕过类型契约。仅公开幂等
      unarchiveSession，复用 registry 串行队列与持久化提交，并在销毁前排空已接纳操作。
      archive-manager 的鉴权、路由和 UI 留在插件；覆盖并发、失败重试与卸载持久化。
      上游提供等价取消归档 API 后撤。
  - file: 0017-session-query-document-projection.patch
    reason: |
      查询服务的全文索引和 literal filter 都在私有路径生成语义文档，事后过滤搜索
      结果会破坏排序、分页与摘要，也不能清除旧索引。只提供可覆写 buildSearchDocuments
      与稳定 searchDocumentVersion 接缝；版本参与持久化修订比对，旧索引自动重建。
      rewind 通过配置替换 SQLite provider，复用其索引、取消、生命周期和分页；
      墓碑规则完全在插件，精确日志读取/审计与搜索启用配置保留原语义。
      Include 的 name 是目标校验而非替换操作，新增显式 replaceName 并保留该校验；
      克隆插入和覆写值，避免重复合成污染配置层。真实 base/web/插件/用户层组合回归。
      上游提供等价文档投影、索引版本和配置 provider 替换接口后撤。
  - file: 0018-conversation-draft-image-api.patch
    reason: |
      inputActions.addImages 只接受已经注册的 DraftAttachmentId，不能直接放入历史
      attachmentId。ConversationController 已有 createDraftImages/releaseDraftImages，
      但 IConversation 不暴露。仅公开这两个通用方法，并在整批注册失败时回滚临时URL。
      rewind 插件通过公开 Session.readAttachment 读取图片，先准备完整草稿，再执行
      撤回与回填；失败、取消和跨会话回调的资源管理均由插件负责。
      上游公开等价草稿附件注册接口后撤。
