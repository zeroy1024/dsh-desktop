# 对 upstream/ 的全部源码变更都在此登记，sync-upstream.ts 按顺序 git apply。
#
# 边界铁律：能做成 dsh 插件的不动配置，能写成 cordis.patch.yml 配置叠层的不动源码。
# 只有当前两条路都走不通时才允许新增补丁，且必须写明理由。
#
# ⚠️ 0.1.2 迁移期（upgrade/dsh-v0.1.2-rc.1 分支）：其余补丁按
#    docs/upgrade-dsh-0.1.2-rc.1-phases.md 逐个重做后回归登记。
#
# 每条记录：
#   file:     补丁文件名（相对本目录，建议 NNNN-描述.patch 命名）
#   reason:   为什么必须改源码（而不是插件/配置）
#   upstream: 对应的上游 issue/PR（有则填，上游修复后应移除本补丁）
patches:
  - file: 0006-ui-layout-panel-seam.patch
    reason: |
      右侧面板列缝（承载 @dsh-desktop/panel-shell 插件）：ui-layout 四列化
      （panel 让位步骤 3-5 + panel/panelExpanded store 状态 + ctx.layout panel
      动作 + panel 槽声明与渲染点/拖拽手柄/全屏 overlay 接管）。panel 默认宽
      480、最小 320、无固定偏好上限（viewport 余量为动态上限）；CENTER_MIN
      640→360 以在四列下留出中栏空间；SIDEBAR_DEFAULT 280→320（吸收原 0004，
      其补丁撤销——columns 是契约常量且 layout 服务面刻意不暴露宽度写入，
      插件与配置层均不可达，两个修改点同文件已合并）。0.1.2 适配：store 绑定
      改 dsh-client-store（defineStore/EngineStoreHandle）、panel 槽按
      declaring-is-claiming 在同一 register() children 声明、details 槽保留
      SessionProvider 内 eager 调用（上游契约：无会话时槽注册仍发生）、
      --dsh-sidebar-collapsed-track 折叠轨变量缝与 100cqi 全屏 pin 语义保留。
      撤 0006 无连带（原 0004 已并入）；上游未来自带 panel 列应整体撤补丁，
      插件改指上游契约
  - file: 0007-ui-trajectory-panel-page.patch
    reason: |
      轨迹视图呈现位迁移（0.1.2 重做，反转控制版）：trajectory 不再向
      slots.inject 声明 panel-shell.page（实测：0.1.2 的 ui-slots 对「当前无
      宿主声明的槽」的 inject 在多插件组合下使 cordis apply 竞态收到
      undefined ctx——desktop 冒烟复现、web 单独正常），改为
      reflect.provide('trajectoryPanelPage') 注册服务；panel-shell 声明该
      服务依赖（fiber 拓扑保证 trajectory 先行）并代为注册双半，页面生命周期
      挂 panel-shell fiber。web 宿主无人消费，服务闲置无副作用。数据管线六组
      定义与注入面逐字保留（已迁 uiSession/uiConversation 新服务名）。
      panel-shell 的类型面在补丁内本地声明合并，register 经最小结构断言对齐
      框架运行时。上游自带面板页注册或开放导出后撤
  - file: 0008-ui-chat-panel-inspect-handoff.patch
    reason: |
      面板侧 inspect 交接缝（0.1.2 重做，宿主迁 ui-chat）：inspectCall 内嵌于
      ChatView 的 openView 合成，插件无拦截点；且面板列在 conversation 子树之外，
      chat store 的 inspect 目标对面板侧不可达。经 ChatViewInjected 增加
      inspectHandoff 可选注入——apply 层惰性探测 panelShell 服务，在则整体委托
      （开列→开页→下发一次性选中目标），不在则上游 openView 路径原样保留。
      上游自带面板 inspect 集成后撤
  - file: 0010-api-session-controller-image-admission.patch
    reason: |
      Web prompt 的图片准入缝（0.1.2 重做，宿主迁 api/session-controller 的
      prompt 命令）：准入逻辑内嵌于 Remote 服务实现，插件无法在附件持久化前
      表达“可转写”。抽出可测的 imagePromptAdmission helper（image-admission.ts，
      补丁新增）经可选 imageInputAdmission 服务询问 bridge/abstain——
      inputModalities 原生事实不变、原生图片路由与无图请求不受影响、无服务时
      行为与上游一致；解析失败经 admit('unknown','failed') 决定是否桥接。
      错误面保持上游 RemoteError session/attachment-invalid。上游提供正式图片
      桥接准入契约后撤
  - file: 0011-llm-input-transform-seam.patch
    reason: |
      LlmRuntime 原先只提供 text-only 占位投影，插件无法在精确模型能力解析后、
      适配器分发前提供一次性图片转写。0.1.2 实测：adapterStream 分发边界、
      resolveModelInfo→resolveCallConfig→图像投影→dispatch 的瀑布原样，缝位
      不变，补丁近乎平移（基类 TypertRemoteService/deepFreeze 移位/README 区域
      上游重写为 "What you can do" 摘要列表，registerInputTransform 以一条
      bullet 并入）。上游提供同等 pre-dispatch transform 契约后撤
  - file: 0009-ui-chat-file-browser-open-seam.patch
    reason: |
      ui-chat 的 openFile 回调内嵌于 apply 注入闭包（0.1.2 已改走
      ctx.remote.session.openWorkspacePath），插件没有可替换的拦截点；新增可选
      fileBrowser.tryOpen 接缝，保留目录打开、服务缺席及未处理路径的原系统打开
      回退。上游提供可扩展 openFile service/middleware 后撤
  - file: 0012-core-session-rewind-tombstone.patch
    reason: |
      会话撤回（墓碑）的 core 解释层（0.1.2 重做）：'dsh-desktop/session-rewind'
      事件由 @dsh-desktop/rewind 插件 append（写入侧零源码改动），其折叠解释
      （surface truncate）内嵌于 dsh-session 的 planSurfaceEvent/applySurfacePlan
      私有汇合点——live append、fromRestore、foldSurface 三条路径共用，插件无
      拦截面。0.1.2 适配：seq 类型品牌化（SessionSeq/SessionLogOffset）下重放；
      known-event-types 仍为生成式硬编码集合（上游架构笔记明示否决可注册注册表），
      墓碑按旧法登记目录与 SessionEventMap declaration-merge；测试访问器随新 API
      改 snapshotEvents()。墓碑不可标 ignorable（跳过=重建出未截断的错误会话）；
      官方 CLI 打开含墓碑会话显式拒读（ADR-0007）。持久化已改 JSONL，roundtrip
      与拒读行为在阶段 7 专项测试覆盖。上游落地原生 rewind/truncate 原语后撤
  - file: 0014-settings-nav-archive-icon.patch
    reason: |
      设置导航项图标由 ui-settings-general shell 的 navIcon(id) 按 section id
      硬编码映射（未知 id 回退齿轮），settings.section 注册 options 仅透传
      id/order/label，图标面插件层完全不可达；为 @dsh-desktop/archive-manager
      的归档页补一行 archive-manager → IconArchiveOutline20 映射（0.1.2 重放：
      上游新版同区域新增了 ConnectionIndicator 导入，冲突合并保留）。
      上游开放 section 图标贡献面后撤
  - file: 0015-win32-dialog-sandbox-safe-utf16-read.patch
    reason: |
      Win32 目录选择器 worker 在 Electron 宿主（ELECTRON_RUN_AS_NODE）下 fatal：
      readUtf16 用 koffi.view 把 COM 内存零拷贝包成 external ArrayBuffer，
      Electron 全进程强制的 V8 Sandbox 禁止此操作（官方 Node 不开，上游 Windows
      CI 测不出）。0.1.2 实测上游仍未修（仅修了 NUL 扫描的双字节边界），本补丁
      继续改为 koffi.decode.string16 的拷贝式读取并吸收上游双字节语义（string16
      原生按两字节 NUL 终止）；fake koffi 移除 view mock 以防回退。上游修复后撤
