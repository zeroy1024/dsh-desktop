# 对 upstream/ 的全部源码变更都在此登记，sync-upstream.ts 按顺序 git apply。
#
# 边界铁律：能做成 dsh 插件的不动配置，能写成 cordis.patch.yml 配置叠层的不动源码。
# 只有当前两条路都走不通时才允许新增补丁，且必须写明理由。
#
# 每条记录：
#   file:     补丁文件名（相对本目录，建议 NNNN-描述.patch 命名）
#   reason:   为什么必须改源码（而不是插件/配置）
#   upstream: 对应的上游 issue/PR（有则填，上游修复后应移除本补丁）
patches:
  - file: 0001-session-row-archive-context-menu.patch
    reason: 上游 ui-workspace 无 session-row/action slot，客户端插件只能劫持 DOM 且不可靠；因此最小修改原生会话行交互（含右键菜单导出 Session log：同源 /api/session.export anchor 下载，下载动作纯浏览器行为故留在行组件内）
  - file: 0004-sidebar-default-width.patch
    reason: 桌面侧栏默认宽度取 320；columns.ts 是契约常量且 layout 服务面刻意不暴露宽度写入（ILayout 仅 toggle/open/close），插件与配置层均不可达
  - file: 0005-conversation-chat-group-seam.patch
    reason: 对话流活动分组缝（承载 @dsh-desktop/activity-group 插件）：conversation.chat.group 槽位声明 + chatFlowGrouping 可选装配服务（ctx.get 惰性读取）+ ChatNodeSeat 块区间渲染变体（renderMember 委托）；缝属 ui-conversation 内部装配，插件只能经槽位契约消费、无法自声明。摘自参考实现 dsh-desktop 同名缝，未含其去 tab 改动；上游未来若自带此缝应撤补丁
  - file: 0006-ui-layout-panel-seam.patch
    reason: 右侧面板列缝（承载 @dsh-desktop/panel-shell 插件）：ui-layout 四列化（panel 让位步骤 3-5 + panel/panelExpanded store 状态 + ctx.layout 四个 panel 动作 + panel 槽声明与渲染点/拖拽手柄/全屏接管）。槽位声明是框架渲染点的专属权力，插件只能消费无法自建。摘自参考实现 dsh-desktop 的 dsh-panel-kit P0 同名缝，仅取 panel 本体（未含其 sidebar 归零、shell.toolbar 行与主题桥改动）；含 columns/app-frame 测试中 0004 遗留的 SIDEBAR_DEFAULT 字面值修正（280→320）。**已并入原 0002 的折叠轨 CSS 变量缝**（--dsh-sidebar-collapsed-track 可覆盖折叠轨、desktop-frame 经 chrome.css 设 0px 收轨的语义保留，AppFrame grid 行与 tracks 正则一并重写为四列版）——0006 重写同一区域曾令 0002 的已套用判定（git apply --reverse --check）永久失败、sync 卡死，2026-08-31 合并修复。另含两处本仓自修（参照实现所无，撤补丁时随本体一并移除）：details 拖拽手柄让位右侧面板列（left 减去 panel 轨宽，否则双开时手柄漂进面板列内）；放大覆盖层目标宽改 `calc(100% - 侧栏轨表达式)`，跟随 --dsh-sidebar-collapsed-track 的桌面 0px 覆盖（2026-09-01 review 修复）。上游未来自带 panel 列应整体撤补丁，插件改指上游契约
  - file: 0007-ui-trajectory-panel-page.patch
    reason: 轨迹视图呈现位迁移（对齐参考实现 dsh-desktop 同款改写）：ui-trajectory 的会话 tab 注册替换为 panel-shell.page 面板页双半注册（数据管线六组定义与注入面逐字保留）。插件层不可达——TrajectoryView 未从 client 入口导出，且 tab 注册内嵌于上游 apply 函数体无法从外部摘除；panel-shell 的类型面在补丁内本地声明合并（上游 workspace 无此包），owner 货币含 0008 的 inspect 交接字段（与插件侧 PanelPageOwnerProps 镜像同步）。依赖 0006 的 panel 缝，撤 0006 须连撤本补丁；上游自带面板页注册或开放导出后撤
  - file: 0008-ui-conversation-panel-inspect-seam.patch
    reason: 面板侧 inspect 交接缝（修复轨迹迁入面板后 chat 的 Inspect 按钮失效）：inspectCall 内嵌于上游 apply 闭包，插件无任何拦截点；且面板列在 conversation 子树之外，chat store 里的 inspect 目标（setInspect 写入）对 panel 侧不可达。故最小修改 inspectCall——探测可选 panelShell 服务（ctx.get 惰性读取，同 0005 的 chatFlowGrouping 模式），在则整体委托（开列→开页→下发一次性选中目标），不在则上游 tab 路径原样保留（web 无此服务行为不变）。上游自带面板 inspect 集成后撤
