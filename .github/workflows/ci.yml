name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @dsh-desktop/agent-host test
      - run: pnpm --filter @dsh-desktop/plugin-kit test
      - run: pnpm --filter @dsh-desktop/hello-panel build
      - run: pnpm --filter @dsh-desktop/desktop build

  upstream-sync:
    # 演练 sync-upstream 全链路：证明 patches/ 仍能干净套用到锁定的上游版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:upstream
