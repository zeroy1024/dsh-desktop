name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

# Keep the token least-privileged. No job in this workflow writes to GitHub.
permissions:
  contents: read

# Only supersede an obsolete pull-request run. Pushes and merge-queue runs are
# allowed to finish so that their required status is not lost mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_ARTIFACT_DIR: .ci-artifacts
  DSH_TELEMETRY_DISABLED: '1'
  # Artifact names are scoped to the workflow run, so a fixed name is enough.
  # Do not include run_attempt: "re-run failed jobs" must still download the
  # vendor uploaded by the successful upstream attempt of this run.
  VENDOR_ARTIFACT_NAME: dsh-vendor

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go for Actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache: false

      - name: Validate GitHub Actions workflows
        # Go's checksum database makes this pinned module version immutable.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  # This is the one job allowed to build the patched upstream tree. The packed
  # JS contract is platform-neutral (not byte-reproducible because of generated
  # source maps); native dependencies are installed on each platform below.
  upstream-contract:
    name: Upstream contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'upstream/pnpm-lock.yaml', 'vendor/dsh-cli/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-

      # The root workspace has links into vendor/, which does not exist on a
      # clean checkout. Install only the root tooling needed to run sync first;
      # platform jobs do a complete workspace install after restoring vendor.
      # The vendor contract is a pure function of the upstream pin, the patch
      # queue, the sync script itself, and the Node major. Restore it from the
      # cache instead of rebuilding the patched upstream tree when none of
      # those inputs changed. Exact-key only: a restore-key prefix could hand
      # platform jobs tarballs built for a different fingerprint.
      - name: Compute vendor sync fingerprint
        id: vendor-fingerprint
        shell: bash
        run: |
          set -euo pipefail
          echo "upstream=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore vendor contract cache
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/*.tgz
            vendor/dsh-cli/package.json
            vendor/dsh-cli/pnpm-workspace.yaml
            vendor/dsh-cli/pnpm-lock.yaml
          key: vendor-contract-${{ steps.vendor-fingerprint.outputs.upstream }}-${{ hashFiles('patches/**', 'scripts/sync-upstream.ts', 'scripts/test-upstream-patches.ts', 'scripts/command.ts', '.nvmrc') }}

      - name: Install root tooling for synchronization
        run: pnpm install --filter . --frozen-lockfile --ignore-scripts

      - name: Apply patches, build upstream, and pack vendor artifacts
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: pnpm sync:upstream

      - name: Run targeted upstream patch tests
        # Contract: the repository exposes this command without changing the
        # upstream submodule's package.json. Requires the upstream build, so it
        # only runs when the vendor contract was rebuilt above.
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: pnpm test:upstream-patches

      - name: Reject generated lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml
          pnpm ci:verify-vendor-lock

      - name: Verify vendor contract files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find vendor -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          for file in package.json pnpm-workspace.yaml pnpm-lock.yaml; do
            test -f "vendor/dsh-cli/$file"
          done

      - name: Upload patched vendor contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.VENDOR_ARTIFACT_NAME }}
          # The common vendor/ ancestor is intentional: download into vendor/
          # in each platform job to recreate the expected relative paths.
          path: |
            vendor/*.tgz
            vendor/dsh-cli/package.json
            vendor/dsh-cli/pnpm-workspace.yaml
            vendor/dsh-cli/pnpm-lock.yaml
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p .ci-artifacts/upstream
          node --version > .ci-artifacts/upstream/node-version.txt 2>&1 || true
          pnpm --version > .ci-artifacts/upstream/pnpm-version.txt 2>&1 || true
          git status --short > .ci-artifacts/upstream/git-status.txt 2>&1 || true
          git -C upstream status --short > .ci-artifacts/upstream/upstream-status.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-logs-upstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  platform-check:
    name: Platform / ${{ matrix.platform }}
    needs: upstream-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download patched vendor contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.VENDOR_ARTIFACT_NAME }}
          path: vendor

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'upstream/pnpm-lock.yaml', 'vendor/dsh-cli/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-

      - name: Install platform dsh CLI dependencies
        working-directory: vendor/dsh-cli
        run: pnpm install --prod --frozen-lockfile

      - name: Install root workspace
        run: pnpm install --frozen-lockfile

      - name: Lint (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: pnpm lint

      - name: Typecheck (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Probe native runtime modules
        run: pnpm ci:probe-native

      - name: Run dsh Web runtime smoke
        run: pnpm ci:smoke:dsh

      - name: Install Electron binary
        run: pnpm --filter @dsh-desktop/desktop exec install-electron

      - name: Probe koffi decode under Electron sandbox
        # patches/0015 switched the win32 picker to the copy-based
        # koffi.decode.string16 read, which is safe under the V8 Sandbox that
        # Electron forces in every process (koffi.view fatal-crashes there).
        # The fake-koffi unit tests cannot cover a real host, so exercise the
        # exact call shape inside an ELECTRON_RUN_AS_NODE Electron process.
        run: pnpm ci:probe-electron-sandbox

      - name: Configure Electron Linux sandbox
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          electron_package="$(pnpm --filter @dsh-desktop/desktop exec -- node -p "require.resolve('electron/package.json')")"
          chrome_sandbox="$(dirname "$electron_package")/dist/chrome-sandbox"
          test -f "$chrome_sandbox"
          test ! -L "$chrome_sandbox"
          sudo chown root:root "$chrome_sandbox"
          sudo chmod 4755 "$chrome_sandbox"
          test "$(stat -c '%u:%g %a' "$chrome_sandbox")" = '0:0 4755'

      - name: Run Electron startup smoke (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm ci:smoke:electron

      - name: Run Electron startup smoke (macOS and Windows)
        if: ${{ matrix.platform != 'linux' }}
        run: pnpm ci:smoke:electron

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p .ci-artifacts/platform-${{ matrix.platform }}
          node --version > .ci-artifacts/platform-${{ matrix.platform }}/node-version.txt 2>&1 || true
          pnpm --version > .ci-artifacts/platform-${{ matrix.platform }}/pnpm-version.txt 2>&1 || true
          git status --short > .ci-artifacts/platform-${{ matrix.platform }}/git-status.txt 2>&1 || true
          git -C upstream status --short > .ci-artifacts/platform-${{ matrix.platform }}/upstream-status.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-logs-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # Keep one stable required-check name for branch protection even when the
  # platform matrix grows or runner labels are rotated.
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - workflow-lint
      - upstream-contract
      - platform-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all CI checks to pass
        shell: bash
        env:
          UPSTREAM_RESULT: ${{ needs.upstream-contract.result }}
          PLATFORM_RESULT: ${{ needs.platform-check.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          set -euo pipefail
          echo "workflow-lint: ${WORKFLOW_RESULT}"
          echo "upstream-contract: ${UPSTREAM_RESULT}"
          echo "platform-check: ${PLATFORM_RESULT}"
          test "${WORKFLOW_RESULT}" = success
          test "${UPSTREAM_RESULT}" = success
          test "${PLATFORM_RESULT}" = success
