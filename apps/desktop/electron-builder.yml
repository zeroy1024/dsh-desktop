# electron-builder 配置（v0.0.1 未签名 developer preview）
# 关键点：
#   - dsh CLI 运行时以单个未压缩 tar（.runtime-archive/dsh-cli.tar，由
#     stage-runtime-archive.ts 从 vendor/dsh-cli 产出）随包携带；首启时主进程
#     解压到 userData（src/main/runtime-archive.ts）。NSIS 逐文件携带上万个
#     小文件会让 Windows 安装/升级/卸载极慢（每文件过 Defender），单文件
#     携带把安装器写文件数降到几百
#   - 独立 Node 24 runtime、签名/公证与自动更新仍属于后续完整 P4
#   - 渲染层是 upstream apps/web 的静态 dist，无 webpack/vite 打包步骤
appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: ./electron-builder-after-pack.mjs
directories:
  output: release
files:
  - dist/**
  - package.json
  - resources/icons/icon.png
  # Windows 运行时窗口/任务栏图标（src/main/index.ts appIconPath）
  - resources/icons/icon-win.png
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  # 铺满画布的 Windows 变体：icon.ico 按 macOS grid 留 10% 透明边距，
  # Windows 1:1 渲染会让任务栏/桌面图标显得偏小
  icon: resources/icons/icon-win.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
# NSIS:向导式安装,允许用户自选目录;按机器安装到 Program Files(需管理员)。
# per-user 的 %LOCALAPPDATA% 静默安装不再使用。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
linux:
  icon: resources/icons
  category: Development
  executableName: deepseek-harness
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
appImage:
  # Keep Chromium's sandbox enabled; the afterPack hook installs its helper.
  executableArgs: []
extraResources:
  # 单个未压缩 tar：外层 NSIS solid lzma / dmg UDZO / zip deflate 负责压缩，
  # 安装包体积与逐文件携带基本持平。剪枝（.map/.ts/test 等）在
  # stage-runtime-archive.ts 建包时完成。
  - from: .runtime-archive/dsh-cli.tar
    to: dsh-cli.tar
#   - from: ../../vendor/node-runtime
#     to: node-runtime
# 内置插件由 `pnpm stage:plugins` 放进 dsh-cli/node_modules/@dsh-desktop 后一并
# 进入 tar；这样 Host 插件与 CLI 共用同一份 @deepseek-ai 运行时闭包。
