# electron-builder 配置（v0.0.1 未签名 developer preview）
# 关键点：
#   - extraResources 携带平台原生安装的 dsh CLI 闭包；当前由 Electron 以 Node 模式运行
#   - 独立 Node 24 runtime、签名/公证与自动更新仍属于后续完整 P4
#   - 渲染层是 upstream apps/web 的静态 dist，无 webpack/vite 打包步骤
appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: ./electron-builder-after-pack.mjs
directories:
  output: release
files:
  - dist/**
  - package.json
  - resources/icons/icon.png
  # Windows 运行时窗口/任务栏图标（src/main/index.ts appIconPath）
  - resources/icons/icon-win.png
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  # 铺满画布的 Windows 变体：icon.ico 按 macOS grid 留 10% 透明边距，
  # Windows 1:1 渲染会让任务栏/桌面图标显得偏小
  icon: resources/icons/icon-win.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
# NSIS:向导式安装,允许用户自选目录;按机器安装到 Program Files(需管理员)。
# per-user 的 %LOCALAPPDATA% 静默安装不再使用。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
linux:
  icon: resources/icons
  category: Development
  executableName: deepseek-harness
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
appImage:
  # Keep Chromium's sandbox enabled; the afterPack hook installs its helper.
  executableArgs: []
extraResources:
  - from: ../../vendor/dsh-cli
    to: dsh-cli
    filter:
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
  # electron-builder always excludes a source tree's root `node_modules`.
  # Make it the FileSet root so the complete pnpm runtime closure is copied.
  - from: ../../vendor/dsh-cli/node_modules
    to: dsh-cli/node_modules
    filter:
      - '**/*'
      # prune 非运行时内容:.map/.ts/.md/.pdb 等仅用于开发调试,
      # 不影响 Node 运行时加载,显著减少安装包文件数与体积
      # 注意:yaml 包的 doc/ 目录是运行时依赖(directives.js),不能删
      - '!**/*.map'
      - '!**/*.ts'
      - '!**/*.mts'
      - '!**/*.cts'
      - '!**/*.md'
      - '!**/*.pdb'
      - '!**/CHANGELOG*'
      - '!**/example/**'
      - '!**/examples/**'
      - '!**/test/**'
      - '!**/tests/**'
      - '!**/spec/**'
      - '!**/__tests__/**'
      - '!**/coverage/**'
#   - from: ../../vendor/node-runtime
#     to: node-runtime
# 内置插件由 `pnpm stage:plugins` 放进上面的 dsh-cli/node_modules/@dsh-desktop，
# 不再单独复制；这样 Host 插件与 CLI 共用同一份 @deepseek-ai 运行时闭包。
